<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando con Skylink Pay · Naguaralabs</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: #FFFAF1; color: #050505; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .loader-box { background: #ffffff; border-radius: 20px; padding: 36px 28px; max-width: 440px; width: 100%; border: 3px solid #050505; box-shadow: 6px 6px 0px #050505; }
    .mascot-box { width: 80px; height: 80px; margin: 0 auto 16px; border-radius: 50%; border: 2.5px solid #050505; overflow: hidden; box-shadow: 2px 2px 0px #050505; background: #FF5A0D; }
    .mascot-box img { width: 100%; height: 100%; object-fit: cover; }
    .spinner { width: 44px; height: 44px; border: 4px solid #fed7aa; border-top-color: #FF5A0D; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; margin-bottom: 6px; color: #050505; letter-spacing: 0.5px; }
    p { font-size: 13px; color: #5F5950; margin-bottom: 22px; font-weight: 500; }
    a.btn-direct { display: inline-block; background: #FF5A0D; color: white; border: 2.5px solid #050505; box-shadow: 3px 3px 0px #050505; padding: 12px 24px; border-radius: 12px; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 20px; letter-spacing: 0.5px; font-weight: 800; text-decoration: none; transition: transform 0.1s ease; }
    a.btn-direct:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #050505; }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="mascot-box">
      <img src="/img/mascot/avatar.png" alt="El Pana Naguaralabs">
    </div>
    <div class="spinner"></div>
    <h2>Conectando con Skylink Pay</h2>
    <p>Redirigiendo a la pasarela oficial de pago seguro en Bolívares...</p>
    <a id="btnFallback" href="#" class="btn-direct">Continuar a Skylink Pay →</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('ref') || '';

    async function redirectSkylink() {
      if (!orderId) {
        document.querySelector('p').textContent = 'No se especificó orden de pago.';
        return;
      }

      try {
        const res = await fetch(`/api/order-status/${encodeURIComponent(orderId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          const skylinkUrl = json.data.skylinkUrl || json.data.paymentUrl || `https://dev-axis-payment.valinkgroup.com/pay/${json.data.token}`;
          document.getElementById('btnFallback').href = skylinkUrl;
          window.location.replace(skylinkUrl);
        } else {
          document.querySelector('p').textContent = 'Orden no encontrada o expirada.';
        }
      } catch (e) {
        document.querySelector('p').textContent = 'Error al conectar con la orden.';
      }
    }

    redirectSkylink();
  </script>
</body>
</html>
